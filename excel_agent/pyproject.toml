[project]
name = "excel-agent"
version = "0.1.0"
description = "AI Agent able to interact with Excel files by SQL transformations."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.3",
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "pydantic>=2.13.5",
    "pydantic-ai>=2.31.1",
    "streamlit>=1.63.0",
]

[project.scripts]
excel-agent = "excel_agent.main:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
